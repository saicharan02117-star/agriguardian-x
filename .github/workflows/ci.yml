name: Evaluation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r optiforge/requirements.txt
      - run: node optiforge/tests/js.test.mjs
      - run: python optiforge/tests/test_ml.py -v
      - run: node --check optiforge/js/app.js
      - run: node --check optiforge/js/catalog.js
      - run: cd optiforge && npm install
      - run: cd optiforge && npx playwright install --with-deps chromium
      - run: cd optiforge && npm run test:browser
      - name: Reject common plaintext secrets
        run: "! grep -RIE '(service_role|sk-[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=)' --exclude='SECURITY.md' --exclude='ci.yml' ."
