name: Evaluation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r optiforge/requirements.txt
      - name: JavaScript unit checks
        run: node optiforge/tests/js.test.mjs
      - name: Pytest ML robustness checks
        run: pytest -q optiforge/tests/test_ml.py
      - name: Syntax checks
        run: |
          node --check optiforge/js/app.js
          node --check optiforge/js/catalog.js
          node --check optiforge/js/farmerGuidance.js
          node --check optiforge/firebase/generate_seed.mjs
          python -m py_compile optiforge/ml/features.py optiforge/ml/train.py optiforge/ml/inference.py
      - name: Verify Firestore seed export
        run: |
          node optiforge/firebase/generate_seed.mjs
          test -s optiforge/firebase/seed-data.json
      - run: cd optiforge && npm ci
      - run: cd optiforge && npx playwright install --with-deps chromium
      - name: Browser workflow tests
        run: cd optiforge && npm run test:browser
      - name: Reject plaintext credentials and private keys
        run: |
          ! grep -RIE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|private_key_id|client_email.*iam.gserviceaccount.com|FIREBASE_ADMIN|GOOGLE_APPLICATION_CREDENTIALS[[:space:]]*=|service_role|sk-[A-Za-z0-9_-]{20,})' --exclude='SECURITY.md' --exclude='ci.yml' --exclude='firebase-config.example.js' .
      - name: Verify deny-by-default Firestore rules
        run: |
          grep -q 'match /{document=\*\*}' optiforge/firebase/firestore.rules
          grep -q 'allow read, write: if false' optiforge/firebase/firestore.rules
