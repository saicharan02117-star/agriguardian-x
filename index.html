<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087443"><title>AgriGuardian X</title><style>
:root{--g:#087443;--g2:#07552f;--g3:#20a762;--p:#e8f8ee;--bg:#f5faf7;--ink:#173a29;--m:#61776b;--l:#d8e9de;--r:#c94a3e;--a:#b57b1a;--b:#247c91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:18px}button{font:inherit}.top{height:76px;position:sticky;top:0;z-index:50;background:#fffffff2;backdrop-filter:blur(15px);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{display:flex;gap:10px;align-items:center;font-weight:950;color:var(--g2);cursor:pointer}.logo{width:46px;height:46px;border-radius:15px;background:var(--p);display:grid;place-items:center;font-size:26px}.brand b{font-size:22px}.brand small{display:block;font-size:9px;letter-spacing:.13em;color:#769082}.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}.pri{background:linear-gradient(135deg,var(--g),var(--g3));color:#fff}.soft{background:var(--p);color:var(--g2)}.hero{max-width:1450px;margin:auto;padding:64px 5vw;min-height:82vh;display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center}.pill{display:inline-block;padding:8px 12px;border-radius:999px;background:#effaf3;border:1px solid #c8ead3;color:var(--g);font-size:13px;font-weight:900}.hero h1{font-size:clamp(54px,7vw,92px);line-height:.95;letter-spacing:-.055em;color:#084b2b;margin:18px 0}.hero h1 span{color:var(--g3)}.hero p{font-size:20px;line-height:1.7;color:#4b6959}.actions{display:flex;gap:10px;flex-wrap:wrap}.visual{height:480px;display:grid;place-items:center;perspective:1000px}.vcard{width:90%;height:360px;border-radius:34px;background:radial-gradient(circle,#fff,#e6f7eb 60%,#ccecd6);border:1px solid #cbe7d3;box-shadow:0 28px 70px #06432925;display:grid;place-items:center;text-align:center;animation:f 5s ease-in-out infinite}.vcard .e{font-size:92px}.vcard h2{font-size:38px;color:var(--g);margin:4px}.vcard p{font-size:12px;font-weight:900;color:var(--g)}@keyframes f{50%{transform:translateY(-12px) rotateY(4deg)}}.section{max-width:1450px;margin:auto;padding:70px 5vw}.section h2{font-size:44px;color:#084b2b;margin:0 0 10px}.lead{color:var(--m);font-size:18px;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.card,.panel,.stat,.feat,.media{background:#fff;border:1px solid var(--l);border-radius:20px;box-shadow:0 10px 28px #0643290d}.card{padding:20px}.card i{font-style:normal;font-size:33px}.card h3{color:var(--g2);margin:8px 0}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:24px}.flow div{background:#fff;border:1px solid var(--l);border-radius:14px;padding:13px;text-align:center;color:var(--g2);font-weight:900}
.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 76px)}.side{position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;background:#fff;border-right:1px solid var(--l);padding:14px}.sg{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:950;color:#8aa092;margin:12px 10px 6px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:12px;color:#4e6a5a;font-weight:800;font-size:13px;cursor:pointer}.nav:hover,.nav.on{background:var(--p);color:var(--g2)}.main{position:relative;padding:26px 28px 70px;overflow:hidden}.wm{position:fixed;left:61%;top:58%;transform:translate(-50%,-50%) rotate(-12deg);font-size:clamp(70px,10vw,150px);font-weight:1000;color:#08744308;pointer-events:none;white-space:nowrap}.page{position:relative;z-index:2;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.head h1{margin:0;color:#084b2b;font-size:36px}.head p{margin:5px 0;color:var(--m);font-size:15px}.badge{padding:7px 10px;border-radius:999px;background:var(--p);color:var(--g);font-size:10px;font-weight:950;height:max-content}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:16px}.stat small{color:var(--m);font-size:11px;font-weight:800}.stat b{display:block;color:var(--g2);font-size:27px;margin:5px 0}.grid2{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-top:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.panel{padding:18px}.panel h3{margin:0 0 10px;color:var(--g2);font-size:18px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px;border-radius:11px;background:#f8fcf9;border:1px solid #edf4ef;margin:7px 0}.row b{font-size:13px}.row small{display:block;color:var(--m);font-size:10px}.tag{font-size:9px;font-weight:950;padding:5px 7px;border-radius:999px;background:var(--p);color:var(--g)}.tag.r{background:#fdecea;color:#a23b31}.tag.a{background:#fff3db;color:#8b6014}.tag.b{background:#e7f4f7;color:#236f80}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.feat{min-height:118px;padding:16px;text-align:left;cursor:pointer;position:relative;transition:.2s}.feat:hover{transform:translateY(-5px);box-shadow:0 18px 36px #0643291a}.feat .fi{font-size:27px}.feat b{display:block;color:var(--g2);font-size:14px;margin:8px 0 3px}.feat span{font-size:10px;color:var(--m)}.feat em{position:absolute;right:12px;bottom:10px;color:var(--g);font-style:normal;font-weight:950}.chart{height:210px;display:flex;align-items:end;gap:9px}.col{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:6px}.col i{width:72%;border-radius:8px 8px 2px 2px;background:linear-gradient(#4bc87c,#087443);animation:g 1.2s both;transform-origin:bottom}.col span{font-size:9px;color:var(--m)}@keyframes g{from{transform:scaleY(.08)}to{transform:scaleY(1)}}.donut{width:165px;height:165px;border-radius:50%;background:conic-gradient(#2ab568 0 82%,#eeb04b 82% 94%,#d95f54 94%);position:relative;margin:12px auto}.donut:after{content:'82%\A Healthy';white-space:pre;position:absolute;inset:25px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;color:var(--g2);font-weight:950}.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--g3) 0 73%,#e7f0ea 73%);position:relative;margin:auto}.ring:after{content:'73%\A Recovery';white-space:pre;position:absolute;inset:21px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;color:var(--g2);font-weight:950}.mediaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.media{overflow:hidden}.mv{height:200px;background:linear-gradient(145deg,#d7f2df,#f8fef9);display:grid;place-items:center;font-size:68px;position:relative}.scan{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#45d889,transparent);box-shadow:0 0 18px #45d889;animation:s @media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.features{grid-template-columns:repeat(3,1fr)}.mediaGrid,.cards{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.hero{grid-template-columns:1fr}.visual{height:350px}.shell{grid-template-columns:1fr}.side{position:fixed;left:-300px;top:76px;bottom:0;width:285px;height:auto;z-index:80;transition:.25s}.side.open{left:0}.main{padding:20px 14px 80px}.wm{left:50%}.grid2,.adv{grid-template-columns:1fr}.features{grid-template-columns:repeat(2,1fr)}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:1px solid var(--l);padding:5px}.mobile button{border:0;background:transparent;padding:7px 2px;font-size:9px;color:#587064;font-weight:850}.mobile b{display:block;font-size:18px}.top .soft{display:none}}
@media(max-width:600px){body{font-size:17px}.brand b{font-size:18px}.brand small{font-size:7px}.top{padding:0 10px}.hero{padding:36px 18px}.hero h1{font-size:48px}.hero p{font-size:18px}.section{padding:50px 18px}.section h2{font-size:35px}.cards,.mediaGrid,.grid3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:23px}.features{gap:9px}.feat{padding:13px;min-height:115px}.head{display:block}.badge{display:inline-block;margin-top:8px}.flow{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><script>
const A=document.getElementById('app');
const F=[['farm','🌾','My Farm','Fields, crops and stages'],['monitor','📡','Live Monitoring','Sensors and telemetry'],['weather','🌦️','Weather Intelligence','Rain, wind and risk'],['crop','🌱','Crop Health','Healthy/watch/affected zones'],['disease','🐛','Disease & Pest AI','Confidence-aware diagnosis'],['advice','🧠','AI Advisory','Preventive actions'],['memory','🧬','Crop Memory','Season-long history'],['media','🎥','Rover & Drone Media','Images, videos and evidence'],['treat','💉','Treatment Center','Approval, dose and action'],['water','💧','Smart Irrigation','Moisture + forecast logic'],['nutrients','🧪','Fertilizer & Nutrients','Deficiency guidance'],['natural','🌿','Natural Farming','Bio/botanical suggestions'],['weeds','🌾','Weed Intelligence','Weed maps'],['drone','🚁','Drone Missions','Aerial scan and geotags'],['rover','🤖','Rover Control','Camera, arm and safety'],['map','🗺️','Field Map','Health heatmap'],['harvest','🌾','Harvest Intelligence','Maturity and yield'],['store','🏪','AgriStore','Post-harvest protection'],['loss','🧾','Damage Passport','Before/after evidence'],['market','🔗','AgriMarket 2.0','Crop Passport + price'],['collect','🤝','AgriCollect','Group selling'],['buyer','🛒','Buyer Dashboard','Quality + traceability'],['fpo','🏘️','FPO / Village Mode','Multi-farm service'],['ency','📚','Crop Encyclopedia','Crop reference'],['schemes','🏛️','Government Schemes','Farmer support'],['reports','📄','Reports & Export','PDF/Excel/QR'],['alerts','🔔','Alerts','Crop/device/weather'],['sathi','🎙️','AgriSathi','Local-language voice'],['settings','⚙️','Farmer / Expert Settings','Roles and safety'],['profit','💰','Farm Profit Memory','Expense and break-even'],['input','🛡️','AgriInput Shield','Batch/expiry/source'],['stand','🌱','AgriStand Guardian','Germination and row gaps'],['security','🐾','Animal & Theft Security','Intrusion alerts'],['tasks','📅','Farm Work Planner','Daily farm tasks'],['device','🧰','Device Health Center','Maintenance status'],['startup','📈','Startup Analytics','Farmers/acres/value']];
const nav=['overview','features','farm','monitor','weather','crop','disease','advice','memory','media','treat','water','nutrients','natural','weeds','drone','rover','map','harvest','store','loss','market','collect','buyer','fpo','ency','schemes','reports','alerts','sathi','settings'];
function top(){return `<header class="top"><div class="brand" onclick="home()"><div class="logo">🌿</div><div><b>AgriGuardian X</b><small>RURAL FARM OPERATING SYSTEM</small></div></div><div><button class="btn soft" onclick="go('sathi')">🎙 AgriSathi</button> <button class="btn pri" onclick="go('overview')">Open Dashboard →</button></div></header>`}
function home(){location.hash='';A.innerHTML=top()+`<section class="hero"><div><span class="pill">Rural-first AI • Precision Agriculture • Farm-to-Market</span><h1>Protect farmer value from <span>seed to sale.</span></h1><p>Crop intelligence, drone + rover inspection, disease/pest diagnosis, fertilizer and natural-farming guidance, farmer-approved treatment, recovery verification, harvest, storage and buyer traceability in one platform.</p><div class="actions"><button class="btn pri" onclick="go('overview')">Explore Product</button><button class="btn soft" onclick="go('features')">All Features</button></div></div><div class="visual"><div class="vcard"><div><div class="e">🌱</div><h2>AgriGuardian X</h2><p>PREDICT • SEARCH • DIAGNOSE • TREAT • VERIFY • TRUST</p></div></div></div></section><section class="section"><h2>A complete crop-care and crop-value loop.</h2><p class="lead">Not just a sensor dashboard: each module connects to the next farmer action.</p><div class="cards">${[['🌱','Pre-sowing Intelligence','Suitability, soil and sowing window'],['🐛','Crop Intelligence','Disease, pest, stress and deficiency'],['💉','Precision Action','Measured, farmer-approved intervention'],['✅','Recovery Verification','Before/after comparison and Crop Memory'],['🌾','Harvest + AgriStore','Maturity, yield, window and storage'],['🔗','AgriMarket + AgriCollect','Traceability and group selling']].map(x=>`<div class="card"><i>${x[0]}</i><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="flow">${['Predict','Search','Diagnose','Explain','Approve','Treat','Verify','Learn','Harvest','Trust'].map(x=>`<div>${x}</div>`).join('')}</div></section>`;scrollTo(0,0)}
function side(id){return `<aside class="side" id="side"><div class="sg">Farm Intelligence</div>${[['overview','Overview'],['features','All Features'],['farm','My Farm'],['monitor','Live Monitoring'],['weather','Weather'],['crop','Crop Health'],['disease','Disease & Pest AI'],['advice','AI Advisory'],['memory','Crop Memory'],['media','Rover & Drone Media']].map(x=>N(x,id)).join('')}<div class="sg">Action</div>${[['treat','Treatment'],['water','Irrigation'],['nutrients','Fertilizer'],['natural','Natural Farming'],['weeds','Weeds'],['drone','Drone'],['rover','Rover'],['map','Field Map']].map(x=>N(x,id)).join('')}<div class="sg">Harvest & Market</div>${[['harvest','Harvest'],['store','AgriStore'],['loss','Damage Passport'],['market','AgriMarket'],['collect','AgriCollect'],['buyer','Buyer'],['fpo','FPO / Village']].map(x=>N(x,id)).join('')}<div class="sg">Support</div>${[['ency','Encyclopedia'],['schemes','Schemes'],['reports','Reports'],['alerts','Alerts'],['sathi','AgriSathi'],['settings','Settings']].map(x=>N(x,id)).join('')}</aside>`}
function N(x,id){return `<button class="nav ${x[0]==id?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`}
function mobile(){return `<nav class="mobile"><button onclick="go('overview')"><b>⌂</b>Home</button><button onclick="go('disease')"><b>🔍</b>Scan</button><button onclick="go('features')"><b>▦</b>Features</button><button onclick="go('reports')"><b>▧</b>Reports</button><button onclick="go('sathi')"><b>🎙️</b>AgriSathi</button></nav>`}
function go(id){location.hash='app/'+id;A.innerHTML=top()+`<div class="shell">${side(id)}<main class="main"><div class="wm">AgriGuardian X</div><div class="page">${page(id)}</div></main></div>${mobile()}`;scrollTo(0,0)}
function H(t,s){return `<div class="head"><div><h1>${t}</h1><p>${s}</p></div><span class="badge">DEMONSTRATION DATA</span></div>`}function S(a){return `<div class="stats">${a.map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>`}function R(a){return a.map(x=>`<div class="row"><div><b>${x[0]}</b><small>${x[1]}</small></div><span class="tag ${x[3]||''}">${x[2]}</span></div>`).join('')}function bars(){let v=[58,72,46,80,63,52,69];return `<div class="chart">${v.map((n,i)=>`<div class="col"><i style="height:${n}%"></i><span>${['M','T','W','T','F','S','S'][i]}</span></div>`).join('')}</div>`}function feats(){return `<div class="features">${F.map(x=>`<button class="feat" onclick="${nav.includes(x[0])?`go('${x[0]}')`:`toast('${x[2]} is included')`}"><span class="fi">${x[1]}</span><b>${x[2]}</b><span>${x[3]}</span><em>→</em></button>`).join('')}</div>`}
function overview(){return H('Farm Overview','Charts, alerts, crop health and device status.')+S([['Farm health','91%','overall'],['Alerts','4','priority'],['Moisture','34%','field avg'],['Rover','82%','battery'],['Harvest','63%','ready']])+`<div class="grid3"><div class="panel"><h3>Farm Health Trend</h3>${bars()}</div><div class="panel"><h3>Crop Zones</h3><div class="donut"></div></div><div class="panel"><h3>Treatment Recovery</h3><div class="ring"></div></div></div><div class="grid2"><div class="panel"><h3>AI Predictive Advisory</h3>${R([['Chilli B6','Re-scan before treatment','HIGH','r'],['Tomato A4','Verify recovery','VERIFY','a'],['Plot C','Delay irrigation: rain risk','WEATHER','b'],['Tomato A2','Harvest window in 2 days','HARVEST']])}</div><div class="panel"><h3>Water Use</h3>${bars()}</div></div><div style="margin-top:14px">${feats()}</div>`}
function features(){return H('All Features','Every capability is a large touch-friendly button.')+feats()}
const D={farm:['My Farm','Fields, crops, stages and zones',[['Area','12.4 ac','demo'],['Plots','5','mapped'],['Crops','5','focus'],['Zones','48','tracked'],['Health','91%','overall']]],monitor:['Live Monitoring','Sensors and field nodes',[['Moisture','34%','Plot A'],['Temp','29°C','current'],['Humidity','72%','avg'],['EC','1.4','demo'],['Nodes','6/6','online']]],weather:['Weather Intelligence','Weather converted into farm actions',[['Rain risk','62%','24h'],['Temp','29°C','current'],['Humidity','72%','current'],['Wind','11 km/h','spray check'],['Heat risk','Low','today']]],crop:['Crop Health','Healthy, watch, affected and recovery zones',[['Healthy','82%','zones'],['Watch','12%','zones'],['Affected','6%','localized'],['Recovery','73%','treated'],['Spread risk','2','zones']]],advice:['AI Predictive Advisory','Preventive actions from crop, weather, soil and history',[['Advisories','6','today'],['High priority','2','review'],['Preventive','3','48h'],['Confidence','90%','avg'],['Expert review','1','uncertain']]],memory:['Crop Memory','Longitudinal plant and zone history',[['Zones','48','tracked'],['Treatments','19','logged'],['Outcomes','15','verified'],['History','67 days','season'],['Recurring','3','patterns']]],weeds:['Weed Intelligence','Crop-vs-weed mapping and priority',[['Weed zones','7','mapped'],['High density','2','priority'],['Coverage','3.8%','demo'],['Action','Mechanical','preferred'],['Recheck','2 days','planned']]],drone:['Drone Mission Control','Aerial scan, geotags and rover dispatch',[['Missions','4','demo'],['Scanned','28 ac','total'],['Targets','9','geotagged'],['Last flight','12 min','demo'],['Status','Ready','integration']]],rover:['Rover Control','Camera, arm, mobility and treatment state',[['Battery','82%','AGX-01'],['Mode','Inspection','ready'],['Camera','Active','vision'],['Arm','Ready','multi-angle'],['Treatment','Standby','approval']]],harvest:['Harvest Intelligence','Maturity, yield and weather-aware harvest window',[['Readiness','63%','avg'],['Ready rows','8','priority'],['Yield','2.1 t','demo'],['Window','Good','36h'],['Damage','4.2%','demo']]],store:['AgriStore','Post-harvest environment and shelf life',[['Temp','23°C','stable'],['Humidity','68%','watch'],['Risk','Low','current'],['Batches','3','tracked'],['Shelf life','6 days','demo']]],loss:['Crop Loss & Damage Passport','Geotagged before/after evidence',[['Cases','2','season'],['Affected','0.63 ac','latest'],['Evidence','Complete','geotagged'],['Pairs','8','before/after'],['Passport','Ready','export']]],collect:['AgriCollect','Verified group selling with provenance',[['Farmers','8','matched'],['Quantity','2.8 t','combined'],['Buyer need','3.0 t','A/B'],['Pickup','Planned','shared'],['Traceability','Preserved','per lot']]],fpo:['FPO / Village Mode','Multi-farm services and shared hardware',[['Farmers','42','demo'],['Acres','128','monitored'],['Missions','11','scheduled'],['Lots','24','active'],['Requests','7','today']]],schemes:['Government Schemes','Support, subsidy and FPO information',[['Saved','4','topics'],['Reminders','2','month'],['Categories','8','support'],['Voice','Ready','summary'],['Applications','0','demo']]],alerts:['Alerts','Crop, weather, device and security alerts',[['High','1','crop'],['Weather','1','rain'],['Harvest','1','window'],['Storage','1','watch'],['Security','Clear','current']]]};
function generic(id){let d=D[id]||['Module','Connected AgriGuardian X capability',[['Status','Active','demo'],['Zones','12','connected'],['Actions','3','pending'],['History','Logged','Crop Memory'],['Safety','On','approval']]];return H(d[0],d[1])+S(d[2])+`<div class="grid2"><div class="panel"><h3>Operational View</h3>${R([['Current condition','Latest demo data analyzed','READY'],['Next action','Farmer-facing action prepared','REVIEW'],['Safety','High-risk action needs approval','PROTECTED'],['Crop Memory','Event stored','LOGGED']])}</div><div class="panel"><h3>Connected workflow</h3><p>This module feeds Crop Memory, alerts, reports, treatment/harvest logic and farmer/expert/FPO views.</p></div></div>`}
function disease(){return H('Disease & Pest AI','Confidence, severity, evidence and next action.')+S([['Tomato','Early blight','92%'],['Chilli','Thrips','89%'],['Maize','Leaf blight','87%'],['Groundnut','Leaf spot','90%'],['Cotton','Blight','84%']])+`<div class="grid3">${[['🍅','Tomato','Blight • Septoria • whitefly • fruit borer'],['🌶️','Chilli','Anthracnose • thrips • mites • whitefly'],['🌽','Maize','Leaf blight • rust • armyworm'],['🥜','Groundnut','Leaf spot • white grub • leaf miner'],['🌿','Cotton','Blight • boll rot • sucking pests'],['🔍','Active Diagnosis','Ask rover for closer/underside/stem/whorl images when uncertain']].map(x=>`<div class="panel"><div style="font-size:38px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn soft" onclick="go('media')">View Evidence</button></div>`).join('')}</div>`}
function media(){return H('Rover & Drone Media Center','Images, videos, mission evidence and treatment verification.')+S([['Rover images','128','demo slots'],['Rover videos','12','clips'],['Drone missions','4','aerial'],['Before/after','15','sets'],['Pending','3','hardware feeds']])+`<div class="mediaGrid"><div class="media"><div class="mv">🤖📷<div class="scan"></div></div><div class="mb"><h3>Rover inspection images</h3><p>RGB, macro, underside, stem and maize-whorl capture.</p></div></div><div class="media"><div class="mv" style="background:#e3f3f8">🚁 ▶</div><div class="mb"><h3>Drone mission videos</h3><p>Aerial scan playback and geotagged suspicious zones.</p></div></div><div class="media"><div class="mv">🍃🔍<div class="scan"></div></div><div class="mb"><h3>Before / after recovery</h3><p>Day 0 / Day 2 / Day 5 evidence linked to Crop Memory.</p></div></div></div><div class="notice" style="margin-top:12px">Actual rover/drone camera files replace these placeholders when hardware feeds are connected; demo media is not presented as live footage.</div>`}
function nutrients(){return H('Fertilizer & Nutrient Advisor','Deficiency intelligence, crop-stage guidance and input history.')+S([['Guidance','4','active'],['Flags','2','review'],['Inputs','11','logged'],['Next review','3 days','planned'],['Natural options','6','available']])+`<div class="adv"><div class="panel"><h3>🧪 Nutrient Guidance</h3>${[['🍃','Possible nitrogen stress','Confirm with soil/tissue evidence before adding inputs.'],['🟡','Potassium symptom check','Combine crop stage, soil and history.'],['📒','Input-history aware','Previous fertilizer applications are considered.']].map(x=>`<div class="sugg"><i>${x[0]}</i><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div><div class="panel"><h3>Safety</h3>${R([['Dose recommendation','Needs validated agronomic source','GUARDED'],['Previous application','Included in context','LOGGED'],['Over-application','Blocked by safety rules','SAFE'],['Expert review','Available when uncertain','REVIEW','a']])}</div></div>`}
function natural(){return H('Natural Farming & Biological Suggestions','A separate lower-input advisory layer, not mixed with unverified chemical advice.')+S([['Bio options','6','library'],['Preventive','5','actions'],['Botanical','4','options'],['Soil tips','3','season'],['Human review','Required','choice']])+`<div class="adv"><div class="panel"><h3>🌿 Suggested pathways</h3>${[['🪴','Crop sanitation','Remove heavily infected debris where agronomically appropriate.'],['🦠','Biological control library','Show crop/problem-specific validated bio-inputs when connected.'],['🌱','Soil health','Organic matter, residue and irrigation discipline reminders.']].map(x=>`<div class="sugg"><i>${x[0]}</i><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div><div class="panel"><h3>Recommendation hierarchy</h3>${R([['Preventive','Non-chemical hygiene + monitoring','FIRST'],['Biological','When validated for crop/problem','OPTION'],['Chemical','Only when justified and validated','CONTROLLED','a'],['No treatment','When evidence is insufficient','SAFE']])}</div></div>`}
function treat(){return H('Precision Treatment Center','Diagnosis → explain → approve → measured dose → targeted action → verify.')+S([['Approvals','2','pending'],['Zones','3','localized'],['Dose','Metered','flow check'],['Weather','Pass','demo'],['Verify','2','due']])+`<div class="grid2"><div class="panel"><h3>Recommended Intervention</h3>${R([['Target','Tomato A • Row 4','LOCAL'],['Diagnosis','Early blight • moderate','92%'],['Application','Targeted nozzle + flow sensor','READY'],['Approval','Farmer confirmation required','REQUIRED','a']])}<button class="btn pri" onclick="toast('Demo approval logged')">Approve Demo Treatment</button></div><div class="panel"><h3>No-Touch Safety</h3><p>Sealed cartridge, measuring chamber, pump, flow sensor, solenoid, pressure check and safe flush workflow.</p><div class="notice">Use validated agronomic guidance and human approval for chemical recommendations.</div></div></div>`}
function water(){return H('Smart Irrigation','Crop stage + moisture + forecast + disease risk.')+S([['Moisture','34%','avg'],['Dry zones','2','attention'],['Pump','Ready','control'],['Rain delay','1','zone'],['Water save','18%','demo']])+`<div class="grid2"><div class="panel"><h3>Water Trend</h3>${bars()}</div><div class="panel"><h3>Zone Actions</h3>${R([['Plot A','Moisture adequate','HOLD'],['Plot B','Irrigate demo cycle','WATER','b'],['Plot C','Rain likely — delay','DELAY','a'],['Plot D','Recheck root sensor','CHECK']])}</div></div>`}
function market(){return H('AgriMarket 2.0','Crop Passport, price intelligence and buyer trust.')+S([['Lots','12','active'],['Buyer views','38','week'],['Traceability','94%','complete'],['Reserved','3','lots'],['Offers','6','demo']])+`<div class="grid2"><div class="panel"><h3>Crop Passport</h3>${R([['Seed & sowing','Source, variety, field','RECORDED'],['Crop care','Soil, irrigation, disease/pest','EVIDENCE'],['Treatment','Dose, date, approval, recovery','VERIFIED'],['Harvest','Date, grade, handling','LOT LEVEL']])}</div><div class="panel"><h3>Price view</h3>${R([['Local','₹28/kg','DEMO'],['Mandi','₹30/kg','DEMO'],['Buyer','₹32/kg','DEMO'],['Premium','Not guaranteed','DISCLOSURE','a']])}</div></div>`}
function buyer(){return H('Buyer Dashboard','Quality, quantity, harvest status and evidence-backed traceability.')+S([['Quantity','2.8 t','cluster'],['Grade A','72%','demo'],['Window','36h','best'],['Traceability','94%','complete'],['Lots','4','matched']])+`<div class="panel"><h3>Lot AGX-TOM-042</h3>${R([['Identity','Farmer/lot retained','VERIFIED'],['Crop health','92%','RECORDED'],['Treatment history','Date/dose evidence available','VIEW'],['Claims','No organic/residue-free claim without proof','SAFE','a']])}</div>`}
function reports(){return H('Reports & Export','Watermarked crop reports, QR Crop Passport and damage evidence.')+S([['Crop reports','15','generated'],['Passports','12','lots'],['Damage packs','2','cases'],['Season reports','5','farms'],['Exports','PDF/Excel','ready']])+`<div class="report"><div class="rwm">AgriGuardian X</div><div class="rb"><div class="rh"><div><b>🌿 AgriGuardian X</b><br><small>Crop Intelligence & Buyer Traceability</small></div><div><b>LOT AGX-TOM-042</b></div></div><h2>Tomato Crop Passport</h2><p>Crop health 92% • Traceability 94% • Grade A 72% • 286 kg</p><h3>Lifecycle evidence</h3><p>Seed/source, sowing, field zone, crop inspections, soil/irrigation, disease/pest events, treatment/dose, recovery verification, harvest and post-harvest handling.</p><h3>Media evidence</h3><p>Rover images, drone videos and before/after recovery evidence can be attached when hardware feeds are connected.</p></div></div>`}
function sathi(){return H('AgriSathi','Local-language voice-first farmer assistant, SMS and keypad/IVR workflow.')+S([['Language','Telugu','preferred'],['Voice','Ready','demo'],['SMS','Enabled','workflow'],['Keypad/IVR','Designed','rural'],['Expert','Available','handoff']])+`<div class="grid2"><div class="panel" style="background:#07552f;color:#fff;text-align:center"><div style="font-size:65px">🎙️</div><h2>“నా పంట ఎలా ఉంది?”</h2><p>Most zones are healthy. Chilli Row 6 needs inspection. Rain risk is high, so delay Plot C irrigation.</p></div><div class="panel"><h3>Farmer Mode</h3>${R([['Green button','YES/start approved action','SIMPLE'],['Red button','NO/stop','SAFE'],['Yellow button','Repeat/help','VOICE'],['Phone','SMS/keypad/IVR-ready','RURAL']])}</div></div>`}
function settings(){return H('Farmer / Expert / FPO Settings','Large fonts, roles, language, devices and safety controls.')+`<div class="grid3"><div class="panel"><h3>👨🏽‍🌾 Farmer Mode</h3><p>Large buttons, voice, symbols and only next actions.</p></div><div class="panel"><h3>🧑🏽‍🔬 Expert Mode</h3><p>Confidence, charts, Crop Memory, evidence and dosing records.</p></div><div class="panel"><h3>🏘️ FPO Mode</h3><p>Multiple farms, shared missions, service scheduling and group selling.</p></div></div>`}
function page(id){if(id==='overview')return overview();if(id==='features')return features();if(id==='disease')return disease();if(id==='media')return media();if(id==='nutrients')return nutrients();if(id==='natural')return natural();if(id==='treat')return treat();if(id==='water')return water();if(id==='market')return market();if(id==='buyer')return buyer();if(id==='reports')return reports();if(id==='sathi')return sathi();if(id==='settings')return settings();return generic(id)}
function toast(m){let t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;right:16px;bottom:72px;z-index:999;background:#063d24;color:white;padding:12px 15px;border-radius:12px;font-weight:850';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}window.addEventListener('hashchange',()=>{let h=location.hash.replace('#','');h.startsWith('app/')?go(h.split('/')[1]):home()});location.hash.startsWith('#app/')?go(location.hash.split('/')[1]):home();
</script></body></html>
